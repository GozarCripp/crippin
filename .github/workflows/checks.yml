name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Script tests
        run: python -m unittest discover -s tests -v
      - name: Page script parses
        run: node --check app.js
      - name: Data files are valid JSON
        run: for f in data/*.json; do python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done
